{% extends "layout.html" %}
{% block content %}
<div class="card p-5 border-0 shadow text-center bg-white" style="max-width: 600px; margin: 0 auto;">
    <div class="mb-4"><span class="p-3 bg-light rounded-circle d-inline-block text-danger shadow-sm"><i class="fa-solid fa-notes-medical fa-3x"></i></span></div>
    <h2 class="fw-bold mb-1 text-dark">Diagnostic Evaluation Output</h2>
    <p class="text-muted small mb-4">ML Processing Framework Evaluation Result</p>
    <hr class="my-4">
    <div class="row justify-content-center text-center g-3">
        <div class="col-sm-5 card bg-light p-3 mx-2"><span class="text-muted small text-uppercase">Prediction</span><h3 class="fw-bold text-danger mt-1">{{ prediction }}</h3></div>
        <div class="col-sm-5 card bg-light p-3 mx-2"><span class="text-muted small text-uppercase">Confidence Metric</span><h3 class="fw-bold text-success mt-1">{{ confidence }}%</h3></div>
    </div>
    <div class="alert alert-danger border-start border-4 mt-4 text-start shadow-sm" role="alert">
        <h5 class="alert-heading fw-bold"><i class="fa-solid fa-user-md me-2"></i>Recommendation</h5>
        <p class="mb-0 text-secondary">{{ recommendation }}</p>
    </div>
    <a href="/predict" class="btn btn-outline-secondary mt-3 px-4 btn-sm">Run Another Analysis</a>
</div>
{% endblock %}
