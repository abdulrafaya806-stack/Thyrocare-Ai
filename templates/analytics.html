{% extends "layout.html" %}
{% block content %}
<div class="card p-4 shadow-sm">
    <div class="border-bottom pb-3 mb-4">
        <h2 class="fw-bold text-dark"><i class="fa-solid fa-chart-pie text-success me-2"></i>Performance Engineering Analytics</h2>
        <p class="text-muted small">Static graphs compiled directly from trained optimization models pipeline</p>
    </div>
    <div class="row g-4">
        <div class="col-md-6"><div class="card p-3 border"><h5 class="fw-bold text-muted mb-3">Confusion Matrix</h5><img src="/static/plots/confusion_matrix.png" class="img-fluid rounded" alt="Confusion Matrix"></div></div>
        <div class="col-md-6"><div class="card p-3 border"><h5 class="fw-bold text-muted mb-3">Accuracy Comparison</h5><img src="/static/plots/accuracy_comparison.png" class="img-fluid rounded" alt="Accuracy Comparison"></div></div>
        <div class="col-md-6"><div class="card p-3 border"><h5 class="fw-bold text-muted mb-3">Feature Importance</h5><img src="/static/plots/feature_importance.png" class="img-fluid rounded" alt="Feature Importance"></div></div>
        <div class="col-md-6"><div class="card p-3 border"><h5 class="fw-bold text-muted mb-3">Class Distribution</h5><img src="/static/plots/class_distribution.png" class="img-fluid rounded" alt="Class Distribution"></div></div>
    </div>
</div>
{% endblock %}
